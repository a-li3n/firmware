---
Meta:
  name: Femtofox LR2021 with TCXO
  support: community
  compatible:
    - luckfox-pico-mini # Armbian

Lora:
## LR2021 radio module (SubGHz + 2.4GHz wideband)
## Pin mapping matches the femtofox LR1121 template
## No external RF switch — radio handles switching internally
  Module: lr2021
  gpiochip: 1 # subtract 32 from the gpio numbers
  DIO3_TCXO_VOLTAGE: 1.8
  CS: 16 #pin6 / GPIO48 1C0
  IRQ: 23  #pin17 / GPIO55 1C7
  Busy: 22 #pin16 / GPIO54 1C6
  Reset: 25 #pin13 / GPIO57 1D1

  # SubGHz max power (dBm). Default 22, max 22.
  LR2021_MAX_POWER: 22
  # 2.4GHz max power (dBm). Default 12, max 12.
  LR2021_MAX_POWER_HF: 12

  spidev: spidev0.0 #pins are (CS=16, CLK=17, MOSI=18, MISO=19)
  spiSpeed: 2000000
